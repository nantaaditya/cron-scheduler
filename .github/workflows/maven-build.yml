name: Maven Build

on: [push]

jobs:
  maven_build:
    runs-on: ubuntu-latest
    name: maven_build
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build project with Maven
        run: mvn verify